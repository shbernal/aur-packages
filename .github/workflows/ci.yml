name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: commit-check/commit-check-action@v2
        with:
          message: true
          branch: false

  changed:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: list
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        run: |
          packages=$(scripts/changed-packages "$BASE" HEAD | jq -Rnc '[inputs]')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Packages: $packages"

  build:
    needs: changed
    if: needs.changed.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changed.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
      - env:
          PACKAGE: ${{ matrix.package }}
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo archlinux:base-devel scripts/check-package "$PACKAGE"

  # The single required status check: matrix job names change with the packages.
  ci-ok:
    if: always()
    needs: [commit-check, changed, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          ! jq -e 'any(. == "failure" or . == "cancelled")' <<<"$RESULTS"
