name: Publish

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "!packages/*/.nvchecker.toml"
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish (empty for all)
        required: false

permissions:
  contents: read

# Every run publishes all out-of-sync packages, so a newer run replaces one
# still waiting for approval without losing anything.
concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: aur
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AUR SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: |
          install -dm700 ~/.ssh
          install -m600 <(printf '%s\n' "$AUR_SSH_PRIVATE_KEY") ~/.ssh/aur
          printf '%s\n' "$AUR_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n  IdentitiesOnly yes\n' > ~/.ssh/config

      - name: Publish out-of-sync packages
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          git config --global user.name shbernal
          git config --global user.email shbernal.01@gmail.com
          if [[ -n $PACKAGE ]]; then
            packages=$PACKAGE
          else
            packages=$(scripts/changed-packages)
          fi
          for pkg in $packages; do
            scripts/publish-package "$pkg"
          done
