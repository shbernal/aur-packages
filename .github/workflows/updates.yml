name: Updates

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updates
  cancel-in-progress: false

jobs:
  updates:
    runs-on: ubuntu-latest
    steps:
      # Pushes and pull requests made with the default GITHUB_TOKEN don't trigger
      # CI, so branches and PRs go through UPDATES_TOKEN.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.UPDATES_TOKEN }}

      - name: Bump packages to their latest upstream release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e HOST_UID="$(id -u)" -e GITHUB_TOKEN \
            -v "$PWD:/repo" -w /repo archlinux:base-devel scripts/upgrade-packages

      - name: Open a pull request per upstream release
        env:
          GH_TOKEN: ${{ secrets.UPDATES_TOKEN }}
        run: |
          git config user.name shbernal
          git config user.email shbernal.01@gmail.com
          scripts/open-update-prs
